name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 gcc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put gcc on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Build, test and make the disk image
        shell: powershell
        run: |
          .\tools\fetch-cjk-fonts.ps1
          .\build.ps1 -Image
          Compress-Archive -Path build\folio.img -DestinationPath build\FolioOS-disk-image.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/FolioOS.zip
            build/FOLIO-FONTS-EXTRA.zip
            build/FOLIO-FONTS-CJK.zip
            build/FolioOS-disk-image.zip
