name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v4.2.0)'
        required: true
        default: 'v4.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 gcc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put gcc on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      # 256 MB image: small download; Compress-Archive (PS 5.1) cannot zip files over 2 GB
      - name: Build, test and make the disk image
        shell: powershell
        run: |
          .\tools\fetch-cjk-fonts.ps1
          .\build.ps1 -Image -ImageMB 256
          Compress-Archive -Path build\folio.img -DestinationPath build\FolioOS-disk-image.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FolioOS ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            build/FolioOS.zip
            build/FolioOS-disk-image.zip
