name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please attach `FOLIO\DIAGNOSTICS.TXT` from the USB drive (or, when FolioOS is installed on the computer, from its partition) — it lists the display, sound, pointer devices and disks FolioOS found.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FolioOS version
      description: Settings › System › About
      placeholder: "4.4.1 beta"
  - type: input
    id: hardware
    attributes:
      label: Computer model
      placeholder: "Lenovo ThinkPad T480, Dell Latitude E7450…"
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Booting from the USB drive (real hardware)
        - FolioOS installed on the computer's disk (real hardware)
        - Installer or Disks and partitions (real hardware)
        - Windows simulator (folio_sim.exe)
        - macOS simulator (build_macos.sh)
        - UEFI host (efi_host.exe)
  - type: textarea
    id: diag
    attributes:
      label: DIAGNOSTICS.TXT
      description: Drag the file here or paste its content.
